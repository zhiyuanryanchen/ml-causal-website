<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" style="background-color: transparent;">
  <defs>
    <style>
      .box { fill: #f8f8f8; stroke: #333; stroke-width: 2; }
      .highlight1 { fill: #FDB515; stroke: #333; stroke-width: 2; }
      .highlight2 { fill: #AE0B2A; stroke: #333; stroke-width: 2; }
      .text { font-family: "Source Han Sans SC", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #333; text-anchor: middle; }
      .text-white { font-family: "Source Han Sans SC", "Noto Sans CJK SC", sans-serif; font-size: 16px; fill: #fff; text-anchor: middle; }
      .small-text { font-family: "Source Han Sans SC", "Noto Sans CJK SC", sans-serif; font-size: 14px; fill: #333; text-anchor: middle; }
      .arrow { stroke: #333; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .decision { fill: #f8f8f8; stroke: #333; stroke-width: 2; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>
  
  <!-- 第一层：随机变量 -->
  <rect x="50" y="20" width="160" height="50" class="box" rx="5"/>
  <text x="130" y="50" class="text">随机变量与分布</text>
  
  <!-- 第二层：期望方差 和 条件概率 -->
  <rect x="320" y="20" width="140" height="50" class="box" rx="5"/>
  <text x="390" y="50" class="text">期望与方差</text>
  
  <rect x="320" y="120" width="140" height="50" class="box" rx="5"/>
  <text x="390" y="150" class="text">条件概率</text>
  
  <!-- 第三层 -->
  <rect x="320" y="220" width="140" height="50" class="box" rx="5"/>
  <text x="390" y="250" class="text">大数定律/CLT</text>
  
  <rect x="550" y="120" width="140" height="50" class="highlight1" rx="5"/>
  <text x="620" y="150" class="text">条件期望 CEF</text>
  
  <!-- 第四层 -->
  <rect x="550" y="220" width="180" height="50" class="box" rx="5"/>
  <text x="640" y="245" class="text">迭代期望定律 LIE</text>
  
  <!-- 第五层：回归 -->
  <rect x="550" y="320" width="200" height="50" class="highlight1" rx="5"/>
  <text x="650" y="340" class="small-text">回归=CEF的</text>
  <text x="650" y="357" class="small-text">线性近似</text>
  
  <!-- 第六层 -->
  <rect x="550" y="420" width="160" height="50" class="box" rx="5"/>
  <text x="630" y="450" class="text">OLS最小二乘</text>
  
  <!-- 第七层 -->
  <rect x="550" y="520" width="140" height="50" class="box" rx="5"/>
  <text x="620" y="550" class="text">多元回归</text>
  
  <!-- 决策节点 -->
  <polygon points="620,620 700,650 620,680 540,650" class="decision"/>
  <text x="620" y="655" class="text">应用目标</text>
  
  <!-- 分支1: 预测 -->
  <rect x="350" y="750" width="100" height="50" class="box" rx="5"/>
  <text x="400" y="780" class="text">预测 Y</text>
  
  <!-- 分支2: 因果 -->
  <rect x="550" y="750" width="140" height="50" class="box" rx="5"/>
  <text x="620" y="780" class="text">估计处理效应</text>
  
  <!-- 底层：因果强调 -->
  <rect x="520" y="840" width="140" height="50" class="box" rx="5"/>
  <text x="590" y="870" class="text">回归≠因果</text>
  
  <rect x="100" y="840" width="180" height="50" class="highlight2" rx="5"/>
  <text x="190" y="870" class="text-white">需要外生性假设</text>
  
  <!-- 连线 -->
  <!-- A to B and D -->
  <path d="M 210,45 L 320,45" class="arrow"/>
  <path d="M 130,70 L 130,145 L 320,145" class="arrow"/>
  
  <!-- B to C -->
  <path d="M 390,70 L 390,220" class="arrow"/>
  
  <!-- D to E -->
  <path d="M 460,145 L 550,145" class="arrow"/>
  
  <!-- E to F -->
  <path d="M 620,170 L 620,220" class="arrow"/>
  
  <!-- F to G -->
  <path d="M 640,270 L 640,320" class="arrow"/>
  
  <!-- G to H -->
  <path d="M 650,370 L 650,420" class="arrow"/>
  
  <!-- H to I -->
  <path d="M 630,470 L 630,520" class="arrow"/>
  
  <!-- I to J -->
  <path d="M 620,570 L 620,620" class="arrow"/>
  
  <!-- J to K (预测) -->
  <path d="M 540,650 L 400,750" class="arrow"/>
  <text x="450" y="700" class="small-text">预测</text>
  
  <!-- J to L (因果) -->
  <path d="M 700,650 L 620,750" class="arrow"/>
  <text x="680" y="700" class="small-text">因果</text>
  
  <!-- L to M -->
  <path d="M 620,800 L 600,840" class="arrow"/>
  
  <!-- M to N -->
  <path d="M 520,865 L 280,865" class="arrow"/>
</svg>
